<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Halocline now playing</title>
    <style>
      /*
       * OBS now-playing overlay (PLAN §8). Restyle from OBS's Browser Source
       * "Custom CSS" by overriding these properties or the .hl-* classes.
       */
      :root {
        --hl-font: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        --hl-text-color: #ffffff;
        --hl-artist-color: var(--hl-text-color);
        --hl-text-shadow: 0 1px 3px rgb(0 0 0 / 0.6);
        --hl-bar-color: #ffffff;
        /* Dark and translucent, so the white fill's edge shows on light and dark scenes. */
        --hl-bar-track-color: rgb(0 0 0 / 0.45);
        --hl-bar-height: 6px;
        /* The layout's design height (140px) less the bar: art stops growing there. */
        --hl-art-max-size: calc(140px - var(--hl-bar-height));
        --hl-gap: 16px;
        --hl-art-placeholder: rgb(255 255 255 / 0.15);
        --hl-fade-ms: 300ms;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      .hl-overlay {
        position: fixed;
        inset: 0;
        font-family: var(--hl-font);
        color: var(--hl-text-color);
        transition: opacity var(--hl-fade-ms) ease;
      }
      .hl-overlay.hl-hidden {
        opacity: 0;
      }
      .hl-tracks {
        position: absolute;
        inset: 0 0 var(--hl-bar-height) 0;
      }
      .hl-track {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        gap: var(--hl-gap);
        opacity: 0;
        transition: opacity var(--hl-fade-ms) ease;
      }
      .hl-track.hl-active {
        opacity: 1;
      }
      .hl-art {
        flex: none;
        height: 100%;
        max-height: var(--hl-art-max-size);
        aspect-ratio: 1;
        background: var(--hl-art-placeholder);
        background-size: cover;
        background-position: center;
      }
      .hl-text {
        min-width: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        /*
         * Scales with the source: two rows fit the height, and a narrow source
         * (375×140 is the recommended size) still fits a useful length of title.
         */
        font-size: var(--hl-font-size, min(calc((100vh - var(--hl-bar-height)) * 0.24), 6vw));
        line-height: 1.2;
        text-shadow: var(--hl-text-shadow);
      }
      .hl-artist,
      .hl-title {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .hl-artist {
        color: var(--hl-artist-color);
        font-size: 0.8em;
        opacity: 0.85;
      }
      .hl-title {
        font-weight: 600;
      }
      .hl-bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: var(--hl-bar-height);
        background: var(--hl-bar-track-color);
      }
      .hl-bar-fill {
        height: 100%;
        width: 0;
        background: var(--hl-bar-color);
      }
    </style>
  </head>
  <body>
    <div class="hl-overlay hl-hidden">
      <div class="hl-tracks">
        <div class="hl-track">
          <div class="hl-art"></div>
          <div class="hl-text">
            <div class="hl-artist"></div>
            <div class="hl-title"></div>
          </div>
        </div>
        <div class="hl-track">
          <div class="hl-art"></div>
          <div class="hl-text">
            <div class="hl-artist"></div>
            <div class="hl-title"></div>
          </div>
        </div>
      </div>
      <div class="hl-bar"><div class="hl-bar-fill"></div></div>
    </div>
    <script>
      'use strict'
      // Reads the player over the API with this page's overlay token, then follows
      // the event stream. The bar moves locally between events.
      const token = new URLSearchParams(location.search).get('token') || ''
      const auth = '?token=' + encodeURIComponent(token)
      const overlay = document.querySelector('.hl-overlay')
      const slots = [...document.querySelectorAll('.hl-track')]
      const fill = document.querySelector('.hl-bar-fill')
      let state = null
      let shownKey = null
      let active = 0

      const artworkUrl = (artwork) =>
        !artwork
          ? null
          : artwork.startsWith('https://')
            ? artwork
            : '/v1/artwork/' + encodeURIComponent(artwork) + auth

      function fillSlot(slot, recording) {
        const url = artworkUrl(recording.artwork)
        slot.querySelector('.hl-art').style.backgroundImage = url
          ? 'url("' + url.replace(/"/g, '%22') + '")'
          : ''
        slot.querySelector('.hl-artist').textContent = recording.artists.join(', ')
        slot.querySelector('.hl-title').textContent = recording.title
      }

      function apply(next) {
        state = next
        const current = next.current
        overlay.classList.toggle('hl-hidden', !current || next.ad)
        if (!current) return
        const key = current.queueItemId + ':' + current.recording.id
        if (key === shownKey) return
        // Cross-fade: fill the hidden slot, then swap which one is shown.
        const incoming = shownKey === null ? active : 1 - active
        fillSlot(slots[incoming], current.recording)
        slots[active].classList.remove('hl-active')
        slots[incoming].classList.add('hl-active')
        active = incoming
        shownKey = key
      }

      function frame() {
        const current = state && state.current
        const duration = current && current.recording.durationMs
        let ratio = 0
        if (duration) {
          const elapsed = state.playing ? Date.now() - state.positionAt : 0
          ratio = Math.min(1, Math.max(0, (state.positionMs + elapsed) / duration))
        }
        fill.style.width = ratio * 100 + '%'
        requestAnimationFrame(frame)
      }

      async function refresh() {
        try {
          const res = await fetch('/v1/player' + auth)
          if (res.ok) apply(await res.json())
        } catch {
          // The event stream's reconnect calls this again.
        }
      }

      function connect() {
        const events = new EventSource('/v1/events' + auth)
        let dropped = false
        const onState = (e) => apply(JSON.parse(e.data))
        events.addEventListener('player.changed', onState)
        events.addEventListener('track.changed', onState)
        events.addEventListener('resync', refresh)
        events.addEventListener('error', () => {
          dropped = true
        })
        events.addEventListener('open', () => {
          if (dropped) void refresh()
          dropped = false
        })
      }

      void refresh()
      connect()
      requestAnimationFrame(frame)
    </script>
  </body>
</html>
