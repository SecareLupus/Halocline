<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Halocline: the layer where fresh water (light, above) meets salt water (deep, below). Dusk palette: amber over indigo. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#211a33"/>
      <stop offset="1" stop-color="#120e1d"/>
    </linearGradient>
    <linearGradient id="fresh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9a0"/>
      <stop offset="1" stop-color="#f39b4c"/>
    </linearGradient>
    <linearGradient id="salt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b46b0"/>
      <stop offset="1" stop-color="#2a1f63"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="512" cy="512" r="300"/></clipPath>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>
  <!-- The halo -->
  <circle cx="512" cy="512" r="356" fill="none" stroke="#f39b4c" stroke-opacity="0.35" stroke-width="20"/>
  <g clip-path="url(#disc)">
    <rect x="200" y="200" width="624" height="624" fill="url(#salt)"/>
    <!-- Fresh water above a gentle wave: the halocline -->
    <path d="M200 200H824V520C752 470 680 470 608 520S464 570 392 520 248 470 200 500Z" fill="url(#fresh)"/>
    <path d="M200 500C248 470 320 470 392 520S536 570 608 520 752 470 824 520" fill="none" stroke="#fff4e3" stroke-width="22" stroke-linecap="round"/>
  </g>
</svg>
