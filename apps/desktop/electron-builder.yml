appId: io.github.secarelupus.halocline
productName: Halocline
executableName: halocline
copyright: Copyright © 2026 Desmond Duval
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
  # The analysis page's libraries are bundled into out/renderer by Vite; their
  # node_modules copies (150 MB, mostly ONNX Runtime builds) are never loaded.
  - '!**/node_modules/{onnxruntime-web,onnxruntime-common,protobufjs,@protobufjs,long,flatbuffers,guid-typescript,platform,essentia.js,node-wav}/**'
# Native modules ship prebuilt N-API binaries, so there's nothing to compile per platform.
npmRebuild: false
asarUnpack:
  - '**/*.node'
linux:
  target: [AppImage, deb]
  category: AudioVideo
  syncDesktopName: true
  maintainer: Desmond Duval <haydre@gmail.com>
  synopsis: Music player for live streaming
deb:
  packageName: halocline
  artifactName: halocline_${version}_${arch}.${ext}
  depends: [libnotify4, libxtst6, libnss3]
win:
  target: [nsis]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  license: ../../LICENSE
publish: null
